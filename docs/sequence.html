<script>window.__trussEngine = (function () {

  ['title', 'title'],
  ['baslik', 'title'],
  ['view', 'view'],
  ['gorunum', 'view'],
  ['theme', 'theme'],
  ['tema', 'theme'],
  ['flow', 'flow'],
  ['akis', 'flow'],
  ['root', 'root'],
  ['kok', 'root'],
]);

const blocks = new Map([
  ['group', 'group'],
  ['grup', 'group'],
  ['node', 'node'],
  ['dugum', 'node'],
]);

const attrNames = new Map([
  ['in', 'group'],
  ['icinde', 'group'],
  ['kind', 'kind'],
  ['tur', 'kind'],
  ['code', 'code'],
  ['kod', 'code'],
  ['note', 'note'],
  ['not', 'note'],
  ['url', 'url'],
  ['bag', 'url'],
]);

  ['->', 'solid'],
  ['~>', 'async'],
  ['<->', 'both'],
]);

const flows = new Set(['down', 'right', 'asagi', 'saga']);
const flowValues = new Map([
  ['down', 'down'],
  ['asagi', 'down'],
  ['right', 'right'],
  ['saga', 'right'],

  const tokens = [];
  let buffer = '';
  let quoted = false;
  for (let i = 0; i < text.length; i += 1) {
    const ch = text[i];
    if (ch === '"') {
      quoted = !quoted;
      buffer += ch;
      continue;
    }

      if (buffer) tokens.push(buffer);
      buffer = '';
      continue;
    }
    buffer += ch;
  }

  return { tokens, unterminated: quoted };

function unquote(value) {
  if (value.length > 1 && value.startsWith('"') && value.endsWith('"')) {
    return value.slice(1, -1);
  }
  return value;
}

function readAttrs(tokens, line, report) {
  const attrs = {};
  for (const token of tokens) {
    const eq = token.indexOf('=');
    if (eq < 1) {
      report('E110', line, { token });
      continue;
    }

      continue;

    title: '',

function build(spec) {

    groupIndex.set(entry.id, group);
    groups.push(group);

  const nodeIndex = new Map();
  for (const entry of spec.nodes) {

      continue;

      } else {
        group = entry.group;
        groupIndex.get(entry.group).members.push(entry.id);
      }
    }
    const node = {
      id: entry.id,
      label: entry.label,
      kind,
      group,
      code: entry.code ?? '',
      note: entry.note ?? '',
      url: entry.url ?? '',
      line: entry.line,
      degree: 0,
    };
    nodeIndex.set(node.id, node);
    nodes.push(node);
  }

  const edges = [];
  const seen = new Set();
  for (const entry of spec.edges) {
    const missing = [entry.from, entry.to].find((id) => !nodeIndex.has(id));
    if (missing) {

    nodeIndex.get(entry.to).degree += 1;
    edges.push({
      from: entry.from,
      to: entry.to,
      label: entry.label ?? '',
      style: entry.style ?? 'solid',
      note: entry.note ?? '',
      line: entry.line,

  for (const node of nodes) {
    if (node.degree === 0) report('W302', node.line, { token: node.id });

    model: {
      title: spec.title || 'untitled',
      view: kept,
      theme: spec.theme,
      flow: spec.flow || (kept === 'dataflow' ? 'right' : 'down'),
      root: spec.root,

      nodes,

function toSource(model) {
  const lines = [];

  lines.push(`view   ${model.view}`);
  if (model.theme && model.theme !== 'dark') lines.push(`theme  ${model.theme}`);
  const defaultFlow = model.view === 'dataflow' ? 'right' : 'down';
  if (model.flow && model.flow !== defaultFlow) lines.push(`flow   ${model.flow}`);
  if (model.root && model.root !== '.') lines.push(`root   ${model.root}`);
  lines.push('');

  for (const group of model.groups) {
    lines.push(`group ${group.id} ${quote(group.label)}`);
  }
  if (model.groups.length) lines.push('');

  for (const node of model.nodes) {
    const parts = [`node ${node.id} ${quote(node.label)}`];
    if (node.group) parts.push(`in=${node.group}`);
    if (node.kind && node.kind !== 'service') parts.push(`kind=${node.kind}`);
    if (node.code) parts.push(`code=${node.code}`);
    if (node.note) parts.push(`note=${quote(node.note)}`);
    if (node.url) parts.push(`url=${node.url}`);
    lines.push(parts.join(' '));

  lines.push('');

  for (const edge of model.edges) {
    const arrow = arrowFor[edge.style] ?? '->';
    const tail = edge.note
      ? ` : ${quote(edge.label)} note=${quote(edge.note)}`
      : edge.label
        ? ` : ${edge.label}`
        : '';
    lines.push(`${edge.from} ${arrow} ${edge.to}${tail}`);
  }

function breakCycles(nodes, edges) {
  const outgoing = new Map(nodes.map((node) => [node.id, []]));
  for (const edge of edges) outgoing.get(edge.from).push(edge);

  const state = new Map(nodes.map((node) => [node.id, 'new']));
  const reversed = [];
  const stack = [];

  for (const node of nodes) {
    if (state.get(node.id) !== 'new') continue;
    stack.push({ id: node.id, cursor: 0 });
    state.set(node.id, 'open');
    while (stack.length) {
      const frame = stack[stack.length - 1];
      const candidates = outgoing.get(frame.id);
      if (frame.cursor >= candidates.length) {
        state.set(frame.id, 'done');
        stack.pop();
        continue;
      }
      const edge = candidates[frame.cursor];
      frame.cursor += 1;
      const target = state.get(edge.to);
      if (target === 'open') {
        reversed.push(edge);
        continue;
      }
      if (target === 'new') {
        state.set(edge.to, 'open');
        stack.push({ id: edge.to, cursor: 0 });

  const reversedSet = new Set(reversed);
  const acyclic = edges.map((edge) =>
    reversedSet.has(edge)
      ? { ...edge, from: edge.to, to: edge.from, flipped: true }

function countInversions(values) {

  let seen = 0;

    for (let i = key; i > 0; i -= i & -i) smaller += tree[i];
    crossings += seen - smaller;
    seen += 1;
    for (let i = key; i < width; i += i & -i) tree[i] += 1;

    for (const [from, to] of links) {

function median(positions) {
  if (!positions.length) return -1;

  const middle = sorted.length >> 1;
  if (sorted.length % 2) return sorted[middle];
  const left = sorted[middle - 1] - sorted[0];
  const right = sorted[sorted.length - 1] - sorted[middle];
  if (left === right) return (sorted[middle - 1] + sorted[middle]) / 2;
  return (sorted[middle - 1] * right + sorted[middle] * left) / (left + right);

function sweep(layers, neighbours, depth, reference) {

  return layer
    .map((id, position) => ({

      position,
      key: groupOf.get(id) ? average.get(groupOf.get(id)) : position,

function orderLayers(layers, links, groupOf, { passes = 8 } = {}) {

    if (!above.has(to)) above.set(to, []);
    below.get(from).push(to);
    above.get(to).push(from);

  let current = layers.map((layer) => [...layer]);
  let best = current.map((layer) => [...layer]);
  let bestCrossings = countCrossings(best, links);

  for (let pass = 0; pass < passes && bestCrossings > 0; pass += 1) {
    const downward = pass % 2 === 0;
    if (downward) {
      for (let depth = 1; depth < current.length; depth += 1) {
        current[depth] = sweep(current, above, depth, depth - 1);
      }
    } else {
      for (let depth = current.length - 2; depth >= 0; depth -= 1) {

    const clusteredCrossings = countCrossings(clustered, links);
    const plainCrossings = countCrossings(current, links);

    const crossings = Math.min(clusteredCrossings, plainCrossings);

      best = current.map((layer) => [...layer]);

function relax(entries, desired) {

function place(layers, links, sizes, { passes = 6 } = {}) {

    if (!above.has(to)) above.set(to, []);
    below.get(from).push(to);
    above.get(to).push(from);
  }

  const rows = layers.map((layer) =>
    layer.map((id) => ({ id, w: sizes.get(id) ?? 1, x: 0 })),

    let cursor = 0;
    for (const entry of row) {

    for (const row of rows) for (const entry of row) positions.set(entry.id, entry.x);

const sequenceMetrics = {

  messageGap: 54,

    lane.y = sequenceMetrics.margin;
    lane.h = sequenceMetrics.headHeight;
    lane.centre = cursor + lane.w / 2;
    cursor += lane.w + sequenceMetrics.headGap;

  const top = sequenceMetrics.margin + sequenceMetrics.headHeight + sequenceMetrics.firstMessage;

  let depth = top;
  const messages = model.edges.map((edge, index) => {
    const from = laneOf.get(edge.from);
    const to = laneOf.get(edge.to);
    const self = edge.from === edge.to;
    const message = {
      index: index + 1,
      from: edge.from,
      to: edge.to,
      label: edge.label,
      note: edge.note ?? '',

      self,
      y: depth,
      x1: from.centre,
      x2: to.centre,
      reach: self ? from.centre + sequenceMetrics.selfReach : to.centre,
      drop: self ? sequenceMetrics.selfDrop : 0,

      ? sequenceMetrics.selfDrop + sequenceMetrics.messageGap

  const open = [];
  for (const message of messages) {
    if (message.self || message.style !== 'solid') continue;
    const top = open[open.length - 1];
    if (top && top.participant === message.from && top.caller === message.to) {
      top.end = message.y;
      bars.push(open.pop());
      continue;
    }
    open.push({
      participant: message.to,
      caller: message.from,
      start: message.y,
      end: 0,
      depth: open.filter((entry) => entry.participant === message.to).length,

    bar.y = bar.start;
    bar.h = Math.max(sequenceMetrics.barWidth, bar.end - bar.start);

    .filter((message) => message.note)
    .map((message) => ({
      text: message.note,
      x: rail,
      y: message.y + (message.self ? message.drop / 2 : 0),
      index: message.index,
    }));

    Math.max(
      cursor - sequenceMetrics.headGap,
      ...messages.map((message) => message.reach + sequenceMetrics.margin),

    ) + sequenceMetrics.margin;

  return {
    kind: 'sequence',
    lanes,
    messages,
    bars,
    notes,
    lifelineEnd,
    width: Math.round(width),
    height: Math.round(lifelineEnd + sequenceMetrics.margin),
    stats: {

      messages: messages.length,
      asynchronous: messages.filter((message) => message.style === 'async').length,

function chainLinks(segments) {
  const links = [];

function spanOf(members, horizontal) {
  const low = Math.min(...members.map((box) => (horizontal ? box.y : box.x)));
  const high = Math.max(...members.map((box) => (horizontal ? box.y + box.h : box.x + box.w)));
  const first = Math.min(...members.map((box) => box.layer));
  const last = Math.max(...members.map((box) => box.layer));
  return { low, high, first, last };

function pushOutsiders(model, boxOf, horizontal) {
  const pad = metrics.groupPad + metrics.gap / 2;
  const axis = horizontal ? 'y' : 'x';

  for (let pass = 0; pass < 3; pass += 1) {
    let moved = false;
    for (const group of model.groups) {
      const members = group.members.map((id) => boxOf.get(id)).filter(Boolean);
      if (!members.length) continue;
      const span = spanOf(members, horizontal);
      const owned = new Set(group.members);
      for (const node of model.nodes) {
        if (owned.has(node.id)) continue;
        const box = boxOf.get(node.id);
        if (box.layer < span.first || box.layer > span.last) continue;
        const start = box[axis];
        const end = start + box[size];
        if (end <= span.low - pad || start >= span.high + pad) continue;
        const centre = (start + end) / 2;
        box[axis] =
          centre < (span.low + span.high) / 2
            ? span.low - pad - box[size]
            : span.high + pad;
        moved = true;
      }
    }
    if (!moved) break;

    const byLayer = new Map();
    for (const node of model.nodes) {
      const box = boxOf.get(node.id);
      if (!byLayer.has(box.layer)) byLayer.set(box.layer, []);
      byLayer.get(box.layer).push({ id: node.id, box });
    }
    const grouped = new Set(model.groups.flatMap((group) => group.members));
    for (const row of byLayer.values()) {
      row.sort((a, b) => a.box[axis] - b.box[axis]);
      for (let i = 1; i < row.length; i += 1) {
        const previous = row[i - 1].box;
        const current = row[i].box;
        const min = previous[axis] + previous[size] + metrics.gap;
        if (current[axis] >= min) continue;
        if (grouped.has(row[i].id) && !grouped.has(row[i - 1].id)) {
          previous[axis] = current[axis] - previous[size] - metrics.gap;
        } else {
          current[axis] = min;
        }
      }
    }

function layout(model) {
  if (model.view === 'sequence') return layoutSequence(model);
  return layoutLayered(model);

function layoutLayered(model) {

  };
}

function zoom(factor, clientX, clientY) {
  const anchor = toUser(clientX, clientY);
  const limit = Math.max(diagram.width, diagram.height);
  const next = Math.min(limit * 3, Math.max(limit / 40, view.w * factor));
  const applied = next / view.w;
  view.h *= applied;
  view.w = next;
  view.x = anchor.x - (anchor.x - view.x) * applied;
  view.y = anchor.y - (anchor.y - view.y) * applied;
  apply();
}

function centreZoom(factor) {
  const box = svg.getBoundingClientRect();
  zoom(factor, box.left + box.width / 2, box.top + box.height / 2);
}

function highlight(id) {
  const related = {};
  related[id] = true;
  const edges = svg.querySelectorAll('.edge');
  for (let i = 0; i < edges.length; i += 1) {
    const edge = edges[i];
    const touches = edge.dataset.from === id || edge.dataset.to === id;
    edge.classList.toggle('lit', touches);
    edge.classList.toggle('faded', Boolean(id) && !touches);
    if (touches) { related[edge.dataset.from] = true; related[edge.dataset.to] = true; }
  }
  const nodes = svg.querySelectorAll('.node');
  for (let i = 0; i < nodes.length; i += 1) {
    nodes[i].classList.toggle('faded', Boolean(id) && !related[nodes[i].dataset.id]);
  }
}

function bindScene() {
  svg.addEventListener('wheel', function (event) {
    event.preventDefault();
    zoom(event.deltaY < 0 ? 0.88 : 1.13, event.clientX, event.clientY);
  }, { passive: false });

  let dragging = null;
  svg.addEventListener('pointerdown', function (event) {
    dragging = { point: toUser(event.clientX, event.clientY) };
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener('pointermove', function (event) {
    if (!dragging) return;
    const box = svg.getBoundingClientRect();
    view.x = dragging.point.x - ((event.clientX - box.left) / box.width) * view.w;
    view.y = dragging.point.y - ((event.clientY - box.top) / box.height) * view.h;
    apply();
  });
  svg.addEventListener('pointerup', function () { dragging = null; });

  const nodes = svg.querySelectorAll('.node');
  for (let i = 0; i < nodes.length; i += 1) {
    const element = nodes[i];
    element.addEventListener('click', function (event) {
      event.stopPropagation();
      pick(element.dataset.id);
    });
    element.addEventListener('mouseenter', function () {
      if (!selection) highlight(element.dataset.id);
    });
    element.addEventListener('mouseleave', function () {
      if (!selection) highlight('');
    });
    element.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') pick(element.dataset.id);
    });
  }

  const boxes = svg.querySelectorAll('.group');
  for (let i = 0; i < boxes.length; i += 1) {
    const element = boxes[i];
    element.addEventListener('click', function (event) {
      if (!editing) return;
      event.stopPropagation();
      selection = { type: 'group', id: element.dataset.group };
      paintPanel();
    });
  }

  const edges = svg.querySelectorAll('.edge');
  for (let i = 0; i < edges.length; i += 1) {
    const element = edges[i];
    element.addEventListener('click', function (event) {
      if (!editing) return;
      event.stopPropagation();
      selection = { type: 'edge', from: element.dataset.from, to: element.dataset.to };
      paintPanel();
    });
  }
}

function pick(id) {
  if (connecting && connecting !== id) {
    model.edges.push({ from: connecting, to: id, label: '', style: 'solid' });
    connecting = null;
    commit();
    return;
  }
  if (connecting === id) { connecting = null; }
  selection = { type: 'node', id: id };
  paintPanel();
  highlight(id);
}

function field(label, name, value, options) {
  if (options) {
    let html = '<label>' + label + '<select data-field="' + name + '">';
    for (let i = 0; i < options.length; i += 1) {
      const chosen = options[i] === value ? ' selected' : '';
      html += '<option' + chosen + '>' + options[i] + '</option>';
    }
    return html + '</select></label>';
  }
  return (
    '<label>' + label + '<input data-field="' + name + '" value="' +
    String(value || '').replace(/"/g, '&quot;') + '"></label>'
  );
}

function row(term, value) {
  return '<dt>' + term + '</dt><dd>' + value + '</dd>';
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function paintPanel() {
  if (!selection) { panel.classList.remove('open'); return; }
  panel.classList.add('open');

  if (selection.type === 'edge') {
    const edge = model.edges.filter(function (entry) {
      return entry.from === selection.from && entry.to === selection.to;
    })[0];
    if (!edge) { selection = null; panel.classList.remove('open'); return; }
    panel.innerHTML =
      '<h2>' + escapeHtml(edge.from) + ' → ' + escapeHtml(edge.to) + '</h2>' +
      (editing
        ? '<div class="form">' +
          field(t('label'), 'label', edge.label) +
          field(t('style'), 'style', edge.style, ['solid', 'async', 'both']) +
          '<div class="actions"><button data-act="drop">' + t('remove') + '</button></div></div>'
        : '<dl>' + row(t('label'), escapeHtml(edge.label) || t('none')) + '</dl>');
    bindPanel(edge, 'edge');
    return;
  }

  if (selection.type === 'group') {
    const group = model.groups.filter(function (entry) { return entry.id === selection.id; })[0];
    if (!group) { selection = null; panel.classList.remove('open'); return; }
    const members = model.nodes.filter(function (node) { return node.group === group.id; });
    panel.innerHTML =
      '<h2>' + escapeHtml(group.label) + '</h2><div class="muted">' + escapeHtml(group.id) + '</div>' +
      (editing
        ? '<div class="form">' + field(t('labelField'), 'label', group.label) +
          '<div class="actions"><button data-act="drop">' + t('remove') + '</button></div></div>'
        : '') +
      '<dl>' + row(t('members'), members.length ? escapeHtml(members.map(function (node) { return node.id; }).join(', ')) : t('none')) + '</dl>';
    bindPanel(group, 'group');
    return;
  }

  const node = model.nodeIndex.get(selection.id);
  if (!node) { selection = null; panel.classList.remove('open'); return; }
  const inbound = model.edges.filter(function (e) { return e.to === node.id; }).map(function (e) { return e.from; });
  const outbound = model.edges.filter(function (e) { return e.from === node.id; }).map(function (e) { return e.to; });

  if (editing) {
    const groups = [''].concat(model.groups.map(function (group) { return group.id; }));
    panel.innerHTML =
      '<h2>' + escapeHtml(node.label) + '</h2><div class="muted">' + escapeHtml(node.id) + '</div>' +
      '<div class="form">' +
      field(t('labelField'), 'label', node.label) +
      field(t('kind'), 'kind', node.kind, data.kinds) +
      field(t('group'), 'group', node.group, groups) +
      field(t('code'), 'code', node.code) +
      field(t('note'), 'note', node.note) +
      '<div class="actions">' +
      '<button data-act="connect">' + t('connect') + '</button>' +
      '<button data-act="drop">' + t('remove') + '</button>' +
      '</div></div>';
    bindPanel(node, 'node');
    return;
  }

  panel.innerHTML =
    '<h2>' + escapeHtml(node.label) + '</h2><div class="muted">' + escapeHtml(node.id) + '</div><dl>' +
    row(t('kind'), node.kind) +
    (node.group ? row(t('group'), escapeHtml(node.group)) : '') +
    row(t('code'), node.code ? '<code>' + escapeHtml(node.code) + '</code>' : '<span class="muted">' + t('unbound') + '</span>') +
    (node.note ? row(t('note'), escapeHtml(node.note)) : '') +
    (node.url ? row(t('link'), '<a href="' + encodeURI(node.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(node.url) + '</a>') : '') +
    row(t('inbound'), inbound.length ? escapeHtml(inbound.join(', ')) : t('none')) +
    row(t('outbound'), outbound.length ? escapeHtml(outbound.join(', ')) : t('none')) +
    '</dl>';
}

function bindPanel(target, type) {
  const inputs = panel.querySelectorAll('[data-field]');
  for (let i = 0; i < inputs.length; i += 1) {
    const input = inputs[i];
    input.addEventListener('change', function () {
      target[input.dataset.field] = input.value;
      commit();
    });
  }
  const buttons = panel.querySelectorAll('[data-act]');
  for (let i = 0; i < buttons.length; i += 1) {
    const button = buttons[i];
    button.addEventListener('click', function () {
      if (button.dataset.act === 'connect') {
        connecting = target.id;
        button.textContent = t('pickTarget');
        return;
      }
      if (type === 'group') {
        for (const node of model.nodes) {
          if (node.group === target.id) node.group = '';
        }
        model.groups = model.groups.filter(function (entry) { return entry.id !== target.id; });
      } else if (type === 'node') {
        model.nodes = model.nodes.filter(function (entry) { return entry.id !== target.id; });
        model.edges = model.edges.filter(function (entry) {
          return entry.from !== target.id && entry.to !== target.id;
        });
      } else {
        model.edges = model.edges.filter(function (entry) { return entry !== target; });
      }
      selection = null;
      commit();
    });
  }
}

function commit() {
  for (const group of model.groups) {
    group.members = model.nodes
      .filter(function (node) { return node.group === group.id; })
      .map(function (node) { return node.id; });
  }
  const next = engine.toSource(model);
  const result = compile(next);
  if (result.errors) {
    flash(result.errors[0].code);
    return;
  }
  source = next;
  model = result.model;
  diagram = result.diagram;
  paintScene(true);
  paintPanel();
  const box = document.getElementById('sourceText');
  if (box) box.value = source;
}

function flash(message) {
  const note = document.getElementById('flash');
  note.textContent = message;
  note.classList.add('show');
  setTimeout(function () { note.classList.remove('show'); }, 2200);
}

function paintFooter() {
  const summary = diagram.summary
    .map(function (entry) {
      const name = data.names[entry.key] ? data.names[entry.key][lang] : entry.key;
      return '<span><b>' + entry.value + '</b> ' + name + '</span>';
    })
    .join('');
  document.getElementById('stats').innerHTML = summary;
}

function paintChrome() {
  document.getElementById('search').placeholder = t('search');
  document.getElementById('fit').textContent = t('fit');
  document.getElementById('lang').textContent = lang.toUpperCase();
  document.getElementById('theme').textContent = t('theme');
  document.getElementById('edit').textContent = editing ? t('editing') : t('edit');
  document.getElementById('sourceButton').textContent = t('source');
  document.getElementById('addNode').textContent = t('addNode');
  document.getElementById('addNode').hidden = !editing;
  document.getElementById('addGroup').textContent = t('addGroup');
  document.getElementById('addGroup').hidden = !editing;
  document.getElementById('sourceButton').hidden = !editing;
  paintFooter();
}

document.getElementById('search').addEventListener('input', function (event) {
  const term = event.target.value.trim().toLowerCase();
  const nodes = svg.querySelectorAll('.node');
  for (let i = 0; i < nodes.length; i += 1) {
    const entry = model.nodeIndex.get(nodes[i].dataset.id);
    const haystack = (entry.label + ' ' + entry.id + ' ' + entry.code).toLowerCase();
    nodes[i].classList.toggle('faded', Boolean(term) && haystack.indexOf(term) === -1);
  }
});

document.getElementById('theme').addEventListener('click', function () {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('truss-theme', next); } catch (error) { void error; }
});

document.getElementById('lang').addEventListener('click', function () {
  lang = lang === 'en' ? 'tr' : 'en';
  paintChrome();
  paintPanel();
});

document.getElementById('edit').addEventListener('click', function () {
  editing = !editing;
  connecting = null;
  document.body.classList.toggle('editing', editing);
  paintChrome();
  paintPanel();
});

document.getElementById('addNode').addEventListener('click', function () {
  let index = model.nodes.length + 1;
  while (model.nodeIndex.get('n' + index)) index += 1;
  const id = 'n' + index;
  model.nodes.push({ id: id, label: t('newNode'), kind: 'service', group: '', code: '', note: '', url: '' });
  if (model.nodes.length > 1) {
    model.edges.push({ from: model.nodes[model.nodes.length - 2].id, to: id, label: '', style: 'solid' });
  }
  commit();
  selection = { type: 'node', id: id };
  paintPanel();
});

document.getElementById('addGroup').addEventListener('click', function () {
  let index = model.groups.length + 1;
  const taken = {};
  for (const group of model.groups) taken[group.id] = true;
  while (taken['g' + index]) index += 1;
  const id = 'g' + index;
  model.groups.push({ id: id, label: t('newGroup'), members: [] });
  if (selection && selection.type === 'node') {
    model.nodeIndex.get(selection.id).group = id;
  }
  commit();
  selection = { type: 'group', id: id };
  paintPanel();
});

const sourceBox = document.getElementById('sourceBox');
document.getElementById('sourceButton').addEventListener('click', function () {
  sourceBox.classList.toggle('open');
  document.getElementById('sourceText').value = source;
});

document.getElementById('applySource').addEventListener('click', function () {
  const text = document.getElementById('sourceText').value;
  const result = compile(text);
  if (result.errors) { flash(result.errors[0].code); return; }
  source = text;
  model = result.model;
  diagram = result.diagram;
  selection = null;
  paintScene(false);
  paintPanel();
});

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

document.getElementById('saveSource').addEventListener('click', function () {
  download(new Blob([source], { type: 'text/plain' }), data.slug + '.truss');
});

document.getElementById('fit').addEventListener('click', function () { fit(); });
document.getElementById('zoomIn').addEventListener('click', function () { centreZoom(0.82); });
document.getElementById('zoomOut').addEventListener('click', function () { centreZoom(1.22); });

document.addEventListener('keydown', function (event) {
  if (event.key !== 'Escape') return;
  selection = null;
  connecting = null;
  panel.classList.remove('open');
  sourceBox.classList.remove('open');
  highlight('');
});

function serialise() {
  const clone = svg.cloneNode(true);
  clone.setAttribute('viewBox', '0 0 ' + diagram.width + ' ' + diagram.height);
  clone.setAttribute('width', diagram.width);
  clone.setAttribute('height', diagram.height);
  const computed = getComputedStyle(document.documentElement);
  const names = ['canvas', 'surface', 'raised', 'line', 'line-strong', 'text', 'muted', 'grid'];
  let vars = '';
  for (let i = 0; i < names.length; i += 1) {
    vars += '--' + names[i] + ':' + computed.getPropertyValue('--' + names[i]) + ';';
  }
  const style = document.createElement('style');
  style.textContent = ':root{' + vars + '}' + data.svgStyles;
  clone.insertBefore(style, clone.firstChild);
  clone.setAttribute('style', 'background:' + computed.getPropertyValue('--canvas'));
  return new XMLSerializer().serializeToString(clone);
}

document.getElementById('svgOut').addEventListener('click', function () {
  download(new Blob([serialise()], { type: 'image/svg+xml' }), data.slug + '.svg');
});

document.getElementById('pngOut').addEventListener('click', function () {
  const image = new Image();
  image.onload = function () {
    const sheet = document.createElement('canvas');
    sheet.width = diagram.width * 2;
    sheet.height = diagram.height * 2;
    const context = sheet.getContext('2d');
    context.scale(2, 2);
    context.drawImage(image, 0, 0);
    sheet.toBlob(function (blob) { download(blob, data.slug + '.png'); });
  };
  image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(serialise());
});

try {
  const saved = localStorage.getItem('truss-theme');
  if (saved) document.documentElement.dataset.theme = saved;
} catch (error) { void error; }

const boot = compile(source);
model = boot.model;
diagram = boot.diagram;
bindScene();
paintChrome();
fit();
window.addEventListener('resize', function () { fit(); });
</script>
</body>
</html>
