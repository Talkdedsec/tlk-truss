name: publish

# Run by hand. Add a release trigger once npmjs.com knows this repository and
# this workflow as a trusted publisher; until then a release has no way to
# authenticate and every tag would end in a red cross.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance
