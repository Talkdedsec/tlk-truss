name: Bug report
description: Something the tool got wrong.
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: The .truss source
      description: The smallest source that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Node
      placeholder: "truss 0.1.0, node 24.14.1, Windows 11"
    validations:
      required: true
